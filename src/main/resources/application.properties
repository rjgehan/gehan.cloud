spring.application.name=spring-docker-test
server.port=${PORT:8080}
app.security.username=${APP_USERNAME:family}
app.security.pin=${APP_PIN:${APP_PASSWORD:}}
app.security.reset-pin=${APP_RESET_PIN:}
app.icloud.username=${APP_ICLOUD_USERNAME:}
app.icloud.app-password=${APP_ICLOUD_APP_PASSWORD:}
app.icloud.calendars=${APP_ICLOUD_CALENDARS:}
app.cameras=${APP_CAMERAS:}
app.homeassistant.url=${HA_URL:}
app.homeassistant.token=${HA_TOKEN:}
app.meals.url=${MEALS_URL:}
app.meals.api-key=${MEALS_API_KEY:}
app.meals.household-id=${MEALS_HOUSEHOLD_ID:}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${APP_DATA_DIR:./data}/users;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
