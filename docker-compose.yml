services:
  springapp:
    image: ghcr.io/rjgehan/beach-dashboard:latest
    container_name: springapp
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx512m"
      # Without this the container runs UTC, which is four hours ahead of the house for most of
      # the year - anything asking for "today" flips over at 8pm. The code passes the zone
      # explicitly where it matters; this keeps logs and everything else honest too.
      TZ: America/New_York
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "8080:8080"
    env_file:
      - stack.env

networks:
  traefik:
    external: true
